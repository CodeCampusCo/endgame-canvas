name: CI

on:
  push:
  pull_request:

# One run per branch: a new push cancels the previous in-progress run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Type-check
        run: bunx tsc --noEmit
      - name: Build browser app
        run: bunx vite build
